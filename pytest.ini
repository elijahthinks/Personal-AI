[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --cov=personal_ai
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Tests that may take longer to run (e.g., API calls)

# Note: Tests that require real API calls need OPENAI_API_KEY set in environment
# Tests will skip gracefully if the key is not available

